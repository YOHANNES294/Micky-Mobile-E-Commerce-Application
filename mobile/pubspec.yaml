name: micky_mobile
description: "Micky Mobile Ethiopia - Native Mobile Store for Android and iOS"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Supabase (Auth, Realtime, Database)
  supabase_flutter: ^2.5.6

  # Networking & Payments
  http: ^1.2.1
  url_launcher: ^6.3.0
  webview_flutter: ^4.8.0

  # Local Storage & Utilities
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1

  # UI & Design
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/phones/
